[package]
name = "yumi-test"
version = "0.1.0"
edition = "2021"
description = "CLI testing tool for yumi daemon"

[[bin]]
name = "yumi-test"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
colored = "2"
