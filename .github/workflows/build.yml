name: Build Yumi

# 触发条件：当推送到 main 分支，或者发布 tag 时触发。
# workflow_dispatch 允许在 GitHub 网页端手动点击运行。
on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build and Package
    # 使用最新的 Ubuntu 运行环境
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 

      # 2. 配置 Node.js 环境 (用于编译 WebUI)
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24' # 推荐使用 LTS 版本
          
      # 3. 安装 WebUI 依赖
      - name: Install WebUI dependencies
        working-directory: ./webui
        run: npm install

      # 4. 配置 Rust Nightly 环境并添加 Android 交叉编译目标
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android
          components: rust-src # build-std 需要用到 (含 bpfel-unknown-none)

      # 5. 安装 Android NDK
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      # 6. 安装 LLVM (bpf-linker v0.11.0 需要 LLVM 23+, llvm-sys v231→LLVM 23.1)
      - name: Install LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23
          sudo apt-get install -y llvm-23-dev libclang-23-dev clang-23
          echo "LLVM_PREFIX=/usr/lib/llvm-23" >> $GITHUB_ENV
          echo "/usr/lib/llvm-23/bin" >> $GITHUB_PATH

      # 7. 配置 NDK 环境变量并安装 cargo-ndk
      - name: Setup cargo-ndk
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          cargo install cargo-ndk

      # 8. 运行 xtask 构建脚本
      - name: Run xtask build
        run: cargo xtask build

      # 9. 上传构建产物（目录会被自动打包成 zip）
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: yumi-${{ github.sha }}
          path: output/

  build-test-tool:
    name: Build Test Tool
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Setup cargo-ndk
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          cargo install cargo-ndk

      - name: Build yumi-test for Android
        run: cargo ndk -t arm64-v8a build -p yumi-test --release

      - name: Upload Test Tool
        uses: actions/upload-artifact@v7
        with:
          name: yumi-test-${{ github.sha }}
          path: target/aarch64-linux-android/release/yumi-test
