name: Build Yumi

# 触发条件：当推送到 main 分支，或者发布 tag 时触发。
# workflow_dispatch 允许在 GitHub 网页端手动点击运行。
on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build and Package
    # 使用最新的 Ubuntu 运行环境
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      # 2. 配置 Node.js 环境 (用于编译 WebUI)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # 推荐使用 LTS 版本
          
      # 3. 安装 WebUI 依赖
      - name: Install WebUI dependencies
        working-directory: ./webui
        run: npm install

      # 4. 配置 Rust Nightly 环境并添加 Android 交叉编译目标
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android
          components: rust-src # build-std 需要用到 (含 bpfel-unknown-none)

      # 5. 安装 Android NDK
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      # 6. 配置 NDK 环境变量并安装 cargo-ndk 和 bpf-linker
      - name: Setup cargo-ndk and bpf-linker
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          cargo install cargo-ndk
          cargo install bpf-linker

      # 7. 诊断：打印工具链和环境信息
      - name: Diagnostics
        run: |
          echo "=== rustc version ==="
          rustc --version
          echo "=== cargo version ==="
          cargo --version
          echo "=== which bpf-linker ==="
          which bpf-linker || echo "bpf-linker NOT FOUND in PATH"
          bpf-linker --version || echo "bpf-linker --version failed"
          echo "=== ANDROID_NDK_HOME ==="
          echo "$ANDROID_NDK_HOME"
          echo "=== RUSTFLAGS ==="
          echo "${RUSTFLAGS:-<unset>}"
          echo "=== CARGO_ENCODED_RUSTFLAGS ==="
          echo "${CARGO_ENCODED_RUSTFLAGS:-<unset>}"

      # 8. 单独编译 eBPF 探针
      - name: Build eBPF probe
        run: |
          echo "=== Building yumi-ebpf for bpfel-unknown-none ==="
          unset RUSTFLAGS
          unset CARGO_ENCODED_RUSTFLAGS
          cargo build --package yumi-ebpf --target bpfel-unknown-none -Z build-std=core --release --verbose
          echo "=== eBPF build output ==="
          ls -la target/bpfel-unknown-none/release/yumi-ebpf || echo "eBPF binary NOT FOUND"

      # 9. 运行 xtask 构建脚本（捕获完整日志用于调试）
      - name: Run xtask build
        run: |
          set -eo pipefail
          echo "=== Pre-build: check eBPF binary ==="
          ls -la target/bpfel-unknown-none/release/yumi-ebpf || echo "eBPF binary NOT FOUND before xtask"
          echo "=== Environment ==="
          env | grep -i -E 'rust|cargo|ndk|android|flag' | sort || true
          echo "=== Starting xtask build ==="
          cargo xtask build 2>&1 | tee /tmp/xtask-build.log
          echo "=== xtask build completed ==="

      # 10. 上传构建日志（无论成功失败都上传）
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-log
          path: /tmp/xtask-build.log

      # 11. 动态获取 xtask 生成的 zip 文件名
      - name: Get Artifact Name
        id: artifact-name
        run: |
          set -eo pipefail
          # 找到 output 目录下生成的 zip 文件路径
          FILE_PATH=$(ls output/*.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$FILE_PATH" ] || [ ! -f "$FILE_PATH" ]; then
            echo "错误: 未在 output/ 目录下找到任何生成成功的 zip 模块包！"
            exit 1
          fi
          # 提取纯文件名 (例如 yumi-1.0.0-42-20260409-2000.zip)
          FILE_NAME=$(basename "$FILE_PATH")
          # 去掉 .zip 后缀，防止 GitHub 下载时变成 .zip.zip
          ARTIFACT_NAME="${FILE_NAME%.zip}"
          
          # 将提取出的名字和路径存入 GitHub 环境变量，供下一步使用
          echo "name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          echo "path=$FILE_PATH" >> $GITHUB_OUTPUT

      # 12. 使用动态名称上传构建产物
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          # 使用上一步获取的动态名称
          name: ${{ steps.artifact-name.outputs.name }}
          # 直接上传解压后的模块目录内容，使 GitHub 自动打出的 Zip 可直接在 KernelSU / Magisk 刷入
          path: output/.temp/
