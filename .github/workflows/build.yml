name: Build Yumi

# 触发条件：当推送到 main 分支，或者发布 tag 时触发。
# workflow_dispatch 允许在 GitHub 网页端手动点击运行。
on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build and Package
    # 使用最新的 Ubuntu 运行环境
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # i18n 三端 en/zh 键集对等校验（轻量检查，先于重型构建，失败快速）
      # 详见 scripts/check-i18n-parity.sh：只校验各端内部 en/zh 键集对等，
      # 不做跨端 key 相等校验（三端用途不同，键集合按设计就不可能相等）。
      - name: i18n parity check
        run: bash scripts/check-i18n-parity.sh

      # 2. 配置 Node.js 环境 (用于编译 WebUI) —— 启用 npm 下载缓存
      #    cache: 'npm' 会缓存 ~/.npm/_cacache，加速后续 npm ci 的依赖下载
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # 推荐使用 LTS 版本
          cache: 'npm'
          cache-dependency-path: 'webui/package-lock.json'
          
      # 3. 安装 WebUI 依赖
      #    npm ci 严格按 package-lock.json 安装，比 npm install 更快、更可复现
      - name: Install WebUI dependencies
        working-directory: ./webui
        run: npm ci

      # 4. 配置 Rust Nightly 环境并添加 Android 交叉编译目标
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android
          components: rust-src # build-std 需要用到 (含 bpfel-unknown-none)

      # 5. 计算 Rust 工具链指纹（用于 cargo 工具缓存 key）
      #    bpf-linker 是 rustc 的 linker plugin，与 rustc 版本强绑定：
      #    nightly 更新后旧二进制可能无法加载，必须按 rustc 版本区分缓存。
      - name: Rust toolchain fingerprint
        id: rustc-fp
        run: echo "hash=$(rustc --version | sha256sum | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      # 6. 安装 Android NDK
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      # 7. 设置 NDK 环境变量（无论缓存是否命中都需要）
      - name: Set NDK environment
        run: echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      # 8. 缓存 cargo-ndk 和 bpf-linker 二进制（避免每次从源码编译，节省 ~60-90s）
      #    key 绑定 rustc 指纹：nightly 不变则命中，变了则重建
      - name: Cache cargo tools (cargo-ndk, bpf-linker)
        id: cache-cargo-tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/bin/bpf-linker
          key: cargo-tools-${{ runner.os }}-${{ steps.rustc-fp.outputs.hash }}-v1

      # 9. 安装 cargo-ndk 和 bpf-linker（仅缓存未命中时从源码编译）
      - name: Install cargo-ndk and bpf-linker
        if: steps.cache-cargo-tools.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-ndk
          cargo install bpf-linker

      # 10. 缓存 Rust 编译产物（cargo registry + git 仓库 + target/）
      #     Swatinem/rust-cache 自动按 Cargo.lock 生成 key，支持增量编译
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      # 11. 诊断：打印工具链和环境信息
      - name: Diagnostics
        run: |
          echo "=== rustc version ==="
          rustc --version
          echo "=== cargo version ==="
          cargo --version
          echo "=== which bpf-linker ==="
          which bpf-linker || echo "bpf-linker NOT FOUND in PATH"
          bpf-linker --version || echo "bpf-linker --version failed"
          echo "=== ANDROID_NDK_HOME ==="
          echo "$ANDROID_NDK_HOME"
          echo "=== RUSTFLAGS ==="
          echo "${RUSTFLAGS:-<unset>}"
          echo "=== CARGO_ENCODED_RUSTFLAGS ==="
          echo "${CARGO_ENCODED_RUSTFLAGS:-<unset>}"

      # 12. 单独编译 eBPF 探针
      - name: Build eBPF probe
        run: |
          echo "=== Building yumi-ebpf for bpfel-unknown-none ==="
          unset RUSTFLAGS
          unset CARGO_ENCODED_RUSTFLAGS
          cargo build --package yumi-ebpf --target bpfel-unknown-none -Z build-std=core --release --verbose
          echo "=== eBPF build output ==="
          ls -la target/bpfel-unknown-none/release/yumi-ebpf || echo "eBPF binary NOT FOUND"

      # 13. 运行 xtask 构建脚本（捕获完整日志用于调试）
      - name: Run xtask build
        run: |
          set -eo pipefail
          echo "=== Pre-build: check eBPF binary ==="
          ls -la target/bpfel-unknown-none/release/yumi-ebpf || echo "eBPF binary NOT FOUND before xtask"
          echo "=== Environment ==="
          env | grep -i -E 'rust|cargo|ndk|android|flag' | sort || true
          echo "=== Starting xtask build ==="
          cargo xtask build 2>&1 | tee /tmp/xtask-build.log
          echo "=== xtask build completed ==="

      # 14. 上传构建日志（无论成功失败都上传）
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-debug-log
          path: /tmp/xtask-build.log

      # 15. 动态获取 xtask 生成的 zip 文件名
      - name: Get Artifact Name
        id: artifact-name
        run: |
          set -eo pipefail
          # 找到 output 目录下生成的 zip 文件路径
          FILE_PATH=$(ls output/*.zip 2>/dev/null | head -n 1 || true)
          if [ -z "$FILE_PATH" ] || [ ! -f "$FILE_PATH" ]; then
            echo "错误: 未在 output/ 目录下找到任何生成成功的 zip 模块包！"
            exit 1
          fi
          # 提取完整文件名 (例如 yumi-2.0.1-42-20260805-2100.zip)
          FILE_NAME=$(basename "$FILE_PATH")
          
          # 将提取出的名字和路径存入 GitHub 环境变量，供下一步使用
          echo "name=$FILE_NAME" >> $GITHUB_OUTPUT
          echo "path=$FILE_PATH" >> $GITHUB_OUTPUT

      # 16. 上传构建产物
      # 关键修复：必须用 archive: false 让 GA 直接上传原始 zip，不再套一层 zip 壳。
      # 否则用户从 Actions 页面下载到的是"zip 套 zip"：外层 zip 根目录只有
      # yumi-xxx.zip 这一个文件，KernelSU 在根目录找不到 module.prop，
      # 刷入时报 "Error: specified file not found in archive"。
      # 注意：archive=false 时 name 参数会被忽略，产物名直接用文件名。
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          archive: false
          # 精确指定要上传的 zip 模块包（单个文件）
          path: ${{ steps.artifact-name.outputs.path }}
