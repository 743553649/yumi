# 元数据信息
meta:
  name: "default_config"
  author: "yuki"
  language: "zh"
  loglevel: "INFO"

# 主要功能开关
function:
  CpuIdleScalingGovernor: false
  IOOptimization: true
  GPUControl: false

# IO 设置
IO_Settings:
  Scheduler: "none"
  read_ahead_kb: "128"
  nomerges: "2"
  iostats: "0"

# CPU 空闲设置
CpuIdle:
  current_governor: ""

  port: 14567

# --- 性能模式 ---

# 省电模式 — 极致续航
# 策略：升频极度迟钝，降频极快，天花板压低，尖峰抑制强
powersave:
  cpu_load_governor:
    up_threshold: 0.90
    down_threshold: 0.55
    smoothing_up: 0.30
    smoothing_down: 0.70
    down_rate_limit_ticks: 2
    up_rate_limit_ticks: 3
    headroom_factor: 1.05
    perf_floor: 0.08
    perf_ceil: 0.65
    perf_init: 0.25
    headroom_ramp: 0.20
    up_jump_threshold: 0.40
    slow_up_scale: 0.01
    slow_down_scale: 0.4
    down_fast_threshold: 0.20
    down_fast_mult: 4.0
    spike_jump_threshold: 0.30
    spike_decay: 0.3

# 均衡模式 — 日常使用
# 策略：高响应升频，结合 Race-to-Idle 极速降频归位，兼顾极致流畅与极低功耗
balance:
  cpu_load_governor:
    up_threshold: 0.75
    down_threshold: 0.45
    smoothing_up: 0.55
    smoothing_down: 0.35
    down_rate_limit_ticks: 3
    up_rate_limit_ticks: 2
    headroom_factor: 1.20
    perf_floor: 0.12
    perf_ceil: 1.0
    perf_init: 0.40
    headroom_ramp: 0.15
    up_jump_threshold: 0.35
    slow_up_scale: 0.02
    slow_down_scale: 0.5
    down_fast_threshold: 0.15
    down_fast_mult: 3.0
    spike_jump_threshold: 0.35
    spike_decay: 0.5

# 性能模式 — 低功耗兼顾性能
# 策略：升频响应快但不过激，降频适中，保证突发负载及时响应
performance:
  cpu_load_governor:
    up_threshold: 0.60
    down_threshold: 0.35
    smoothing_up: 0.70
    smoothing_down: 0.25
    down_rate_limit_ticks: 4
    up_rate_limit_ticks: 1
    headroom_factor: 1.35
    perf_floor: 0.25
    perf_ceil: 1.0
    perf_init: 0.50
    headroom_ramp: 0.10
    up_jump_threshold: 0.30
    slow_up_scale: 0.03
    slow_down_scale: 0.55
    down_fast_threshold: 0.08
    down_fast_mult: 2.5
    spike_jump_threshold: 0.40
    spike_decay: 0.6

# 极速模式 — 拉满性能
# 策略：锁定最高频率，不降频，瞬时响应
fast:
  cpu_load_governor:
    up_threshold: 0.01
    down_threshold: 0.01
    smoothing_up: 1.0
    smoothing_down: 0.01
    down_rate_limit_ticks: 10
    up_rate_limit_ticks: 1
    headroom_factor: 2.0
    perf_floor: 1.0
    perf_ceil: 1.0
    perf_init: 1.0
    headroom_ramp: 0.01
    up_jump_threshold: 0.15
    slow_up_scale: 0.20
    slow_down_scale: 0.9
    down_fast_threshold: 0.01
    down_fast_mult: 1.0
    spike_jump_threshold: 0.80
    spike_decay: 0.9
