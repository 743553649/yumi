yumi_scheduler: true
dynamic_enabled: true
global_mode: performance
app_modes:
  com.tencent.tmgp.pubgmhd: fas
  com.tencent.lolm: fas
  com.tencent.tmgp.sgame: fas
  com.tencent.tmgp.speedmobile: fas
  com.miHoYo.hkrpg: fas
  com.miHoYo.GenshinImpact: fas
  com.kurogame.mingchao: fas
  com.hypergryph.arknights: fas
ignored_apps:
- com.android.systemui
- com.android.permissioncontroller
- com.xiaomi.vtcamera
- com.android.providers.media.module
- com.google.android.gms.ui
- com.xiaomi.mibrain.speech
fas_rules:
  fps_gears:
  - 30.0
  - 60.0
  - 90.0
  - 120.0
  - 144.0
  fps_margin: 3.0
  pid:
    kp: 0.04
    ki: 0.008
    kd: 0.005
  cluster_profiles:
  - capacity_weight: 1.0
  - capacity_weight: 1.5
  - capacity_weight: 2.5
  - capacity_weight: 3.5
  auto_capacity_weight: true
  perf_floor: 0.18
  perf_ceil: 1.0
  perf_init: 0.35
  perf_cold_boot: 0.8
  freq_hysteresis: 0.02
  heavy_frame_threshold_ms: 120.0
  loading_cumulative_ms: 2000.0
  loading_normal_tolerance: 3
  loading_perf_floor: 0.55
  loading_perf_ceiling: 0.65
  post_loading_ignore_frames: 5
  post_loading_perf: 0.55
  post_loading_downgrade_guard: 90
  upgrade_confirm_frames: 75
  downgrade_confirm_frames: 100
  upgrade_cooldown_after_downgrade: 100
  gear_dampen_frames: 60
  downgrade_boost_perf_inc: 0.15
  downgrade_boost_duration: 40
  fast_decay_frame_threshold: 60
  fast_decay_perf_threshold: 0.65
  fast_decay_max_step: 0.028
  fast_decay_min_step: 0.005
  jank_cooldown_frames: 18
  max_inc_damped: 0.04
  max_inc_normal: 0.065
  damped_perf_cap: 0.88
  app_switch_gap_ms: 3000.0
  app_switch_resume_perf: 0.5
  freq_force_reapply_interval: 30
  fixed_max_frame_ms: 500.0
  cold_boot_ms: 3000
  verify_freq_interval_secs: 3
  per_app_profiles:
    com.kurogame.mingchao:
      target_fps:
      - 30.0
      - 45.0
      - 60.0
      fps_margin: 3.5
    com.tencent.tmgp.sgame:
      target_fps:
      - 60.0
      - 90.0
      - 120.0
      fps_margin: 3.0
    com.miHoYo.hkrpg:
      target_fps:
      - 30.0
      - 60.0
      fps_margin: 3.0
    com.hypergryph.arknights:
      target_fps:
      - 30.0
      - 60.0
      fps_margin: 3.0
    com.tencent.tmgp.pubgmhd:
      target_fps:
      - 60.0
      - 90.0
      - 120.0
      fps_margin: 3.0
    com.tencent.lolm:
      target_fps:
      - 60.0
      - 90.0
      - 120.0
      - 144.0
      fps_margin: 3.0
    com.miHoYo.GenshinImpact:
      target_fps:
      - 30.0
      - 60.0
      fps_margin: 4.0
    com.tencent.tmgp.speedmobile:
      target_fps:
      - 30.0
      - 60.0
      - 120.0
      - 144.0
      fps_margin: 3.0
  per_app_margins: {}
  core_temp_threshold: 0.0
  core_temp_throttle_perf: 0.7
  util_cap_divisor: 0.45
